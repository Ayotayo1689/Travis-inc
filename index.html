<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travis Inc.</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Video Background -->
    <div class="video-container">
      <video autoplay loop muted playsinline>
        <source

          type="video/mp4"
        />
      </video>
      <div class="overlay"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-content">
        <div class="logo">
          <img src="./logo-black.png" height="60px" alt="" />
        </div>
        <div class="nav-links">
          <a href="register.html">Work</a>
          <a href="register.html">Services</a>
          <a href="register.html">Clients</a>
          <a href="register.html">About</a>
          <a href="register.html">Career</a>
          <a href="register.html">Blog</a>
          <button class="get-in-touch">Get in Touch</button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
      <div class="welcome-box">
        <h1 style="max-width: 600px">
          Welcome to <br />
          <span>Travis investment company</span>
        </h1>
        <button onclick="location.href='register.html'" class="register-btn">
          Register
        </button>
      </div>
    </div>
  </body>
</html>
